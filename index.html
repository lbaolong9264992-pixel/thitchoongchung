<style>

*{

    user-select:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;

#gameWrap{

canvas{

}

.moveBtn{

/* =========================

#startScreen{

.startBox{

/* =========================

<script>

/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const W =
    canvas.width;

const H =
    canvas.height;


/* =========================================================
   GAME
========================================================= */

const game = {

    running:false,

    day:1,

    minute:8*60,

    money:10000000,

    debt:360000000,

    reputation:60,

    customersServed:0,

    totalCustomers:0,

    customerTimer:0,

    nextCustomer:700,

    /*
       TĂNG GẤP ĐÔI
       so với bản cũ 10
    */

    maxCustomers:20,

    name:"Người chơi"

};


/* =========================================================
   ẢNH
========================================================= */

const images = {};


/*
    NỀN DƯỚI:

    File 15.jpg nằm cùng thư mục
    với index.html
*/

const bottomBackground =
    new Image();

bottomBackground.src =
    "15.jpg";


/*
    NỀN TRÊN:

    CHỈ CÒN 1 ẢNH.

    Bạn tự tạo ảnh vừa khít
    phần phía trên rồi đặt:

    assets/background/top-background.png
*/

const topBackground =
    new Image();

topBackground.src =
    "assets/background/top-background.png";


/*
    QUÁN ĂN
*/

const shopImage =
    new Image();

shopImage.src =
    "assets/shop/shop.png";


/*
    KHO NHẬP HÀNG
*/

const warehouseImage =
    new Image();

warehouseImage.src =
    "assets/warehouse/warehouse.png";


/*
    NHÂN VẬT

    Nếu chưa có ảnh thì game
    sẽ tự dùng hình tạm.
*/

const playerImages = {

    down:"assets/player/down.png",

    up:"assets/player/up.png",

    left:"assets/player/left.png",

    right:"assets/player/right.png"

};


/* =========================================================
   PLAYER
========================================================= */

const player = {

    x:550,

    y:520,

    speed:2.7,

    direction:"down",

    radius:15

};


/* =========================================================
   INPUT
========================================================= */

const keys = {};

window.addEventListener(
    "keydown",
    e=>{

        keys[
            e.key.toLowerCase()
        ]=true;

        if(
            e.key==="ArrowUp" ||
            e.key==="ArrowDown" ||
            e.key==="ArrowLeft" ||
            e.key==="ArrowRight"
        ){

            e.preventDefault();

        }

        if(
            e.key.toLowerCase()==="e"
        ){

            serveNearestCustomer();

        }

    }
);


window.addEventListener(
    "keyup",
    e=>{

        keys[
            e.key.toLowerCase()
        ]=false;

    }
);


/* =========================================================
   MOBILE
========================================================= */

const mobileKeys={

    up:"arrowup",

    down:"arrowdown",

    left:"arrowleft",

    right:"arrowright"

};

for(
    const id in mobileKeys
){

    const button=
        document.getElementById(id);

    const key=
        mobileKeys[id];

    button.addEventListener(
        "pointerdown",
        e=>{

            e.preventDefault();

            keys[key]=true;

        }
    );

    button.addEventListener(
        "pointerup",
        e=>{

            e.preventDefault();

            keys[key]=false;

        }
    );

    button.addEventListener(
        "pointerleave",
        ()=>{

            keys[key]=false;

        }
    );

}


/* =========================================================
   CẤU TRÚC MAP
========================================================= */

/*
    QUÁN ĂN:
    BÊN TRÁI

    KHO:
    BÊN PHẢI

    ĐÃ SỬA LẠI SO VỚI CODE CŨ.
*/


const SHOP = {

    x:80,

    y:145,

    w:300,

    h:150

};


const WAREHOUSE = {

    x:720,

    y:145,

    w:300,

    h:150

};


/*
    Các vùng không thể đi xuyên.
*/

const obstacles = [

    SHOP,

    WAREHOUSE

];


/* =========================================================
   BÀN
========================================================= */

const tables=[

    {
        x:400,
        y:350,
        w:100,
        h:55,
        occupied:false,
        customer:null
    },

    {
        x:550,
        y:350,
        w:100,
        h:55,
        occupied:false,
        customer:null
    },

    {
        x:700,
        y:350,
        w:100,
        h:55,
        occupied:false,
        customer:null
    },

    {
        x:400,
        y:465,
        w:100,
        h:55,
        occupied:false,
        customer:null
    },

    {
        x:550,
        y:465,
        w:100,
        h:55,
        occupied:false,
        customer:null
    },

    {
        x:700,
        y:465,
        w:100,
        h:55,
        occupied:false,
        customer:null
    }

];


/* =========================================================
   KHÁCH
========================================================= */

const customerTypes=[

    {
        type:"male",
        color:"#4c78a8",
        speed:1.25,
        patience:80,
        money:120000
    },

    {
        type:"female",
        color:"#c86f98",
        speed:1.15,
        patience:90,
        money:150000
    },

    {
        type:"elderly",
        color:"#888",
        speed:.85,
        patience:120,
        money:100000
    },

    {
        type:"child",
        color:"#e3b63e",
        speed:1.4,
        patience:70,
        money:60000
    },

    {
        type:"rich",
        color:"#d5ad43",
        speed:1.1,
        patience:110,
        money:500000
    },

    {
        type:"difficult",
        color:"#aa5a4d",
        speed:1.3,
        patience:50,
        money:200000
    }

];


let customers=[];


/* =========================================================
   SPAWN POINTS
========================================================= */

/*
    Khách spawn ở nhiều vị trí
    xung quanh bản đồ.

    Không spawn vào quán/kho.
*/

const spawnPoints=[

    {x:25,y:320},

    {x:25,y:520},

    {x:200,y:585},

    {x:500,y:585},

    {x:900,y:585},

    {x:1075,y:320},

    {x:1075,y:520},

    {x:250,y:35},

    {x:500,y:35},

    {x:900,y:35}

];


/* =========================================================
   RANDOM
========================================================= */

function randomItem(array){

    return array[
        Math.floor(
            Math.random()*array.length
        )
    ];

}


/* =========================================================
   DISTANCE
========================================================= */

function dist(a,b){

    return Math.hypot(
        a.x-b.x,
        a.y-b.y
    );

}


/* =========================================================
   COLLISION MAP
========================================================= */

function circleRectCollision(
    x,
    y,
    radius,
    rect
){

    const closestX =
        Math.max(
            rect.x,
            Math.min(
                x,
                rect.x+rect.w
            )
        );

    const closestY =
        Math.max(
            rect.y,
            Math.min(
                y,
                rect.y+rect.h
            )
        );

    const dx=
        x-closestX;

    const dy=
        y-closestY;

    return(
        dx*dx+
        dy*dy
        <
        radius*radius
    );

}


function blocked(
    x,
    y,
    radius=15
){

    for(
        const obstacle
        of obstacles
    ){

        if(
            circleRectCollision(
                x,
                y,
                radius,
                obstacle
            )
        ){

            return true;

        }

    }

    return false;

}


/* =========================================================
   KHÔNG CHO KHÁCH CHỒNG NHAU
========================================================= */

function customerBlocked(
    x,
    y,
    current
){

    const minDistance=30;

    for(
        const other
        of customers
    ){

        if(
            other===current
        ){

            continue;

        }

        if(
            other.state==="leaving"
        ){

            continue;

        }

        const d=
            Math.hypot(
                x-other.x,
                y-other.y
            );

        if(
            d<minDistance
        ){

            return true;

        }

    }

    return false;

}


/* =========================================================
   SPAWN CUSTOMER
========================================================= */

function spawnCustomer(){

    if(
        customers.length>=
        game.maxCustomers
    ){

        return;

    }


    /*
       Thử nhiều lần để tìm
       điểm spawn không bị trùng.
    */

    for(
        let attempt=0;
        attempt<30;
        attempt++
    ){

        const point=
            randomItem(
                spawnPoints
            );

        if(
            customerBlocked(
                point.x,
                point.y,
                null
            )
        ){

            continue;

        }

        const type=
            randomItem(
                customerTypes
            );


        /*
           65% vào quán
           35% khách qua đường
        */

        const wantsShop=
            Math.random()<0.65;


        const customer={

            id:
                Date.now()+
                Math.random(),

            type:type.type,

            color:type.color,

            speed:type.speed,

            patience:type.patience,

            maxPatience:type.patience,

            money:type.money,

            x:point.x,

            y:point.y,

            targetX:point.x,

            targetY:point.y,

            state:"walking",

            wantsShop,

            table:null,

            timer:0,

            order:null,

            exitX:null,

            exitY:null,

            wanderTimer:0,

            passingTarget:null

        };


        /*
           KHÁCH QUA ĐƯỜNG

           Luôn có đích là một
           điểm ở mép đối diện.

           Không random target nữa,
           tránh lỗi kẹt bên phải.
        */

        if(
            !wantsShop
        ){

            setupPasserbyTarget(
                customer,
                point
            );

        }


        customers.push(
            customer
        );

        game.totalCustomers++;

        return;

    }

}


/* =========================================================
   KHÁCH QUA ĐƯỜNG
========================================================= */

function setupPasserbyTarget(
    c,
    spawn
){

    /*
       Đi qua bản đồ theo hướng
       đối diện với vị trí spawn.
    */

    if(spawn.x<100){

        c.targetX=W+80;

        c.targetY=
            80+
            Math.random()*450;

    }

    else if(spawn.x>1000){

        c.targetX=-80;

        c.targetY=
            80+
            Math.random()*450;

    }

    else if(spawn.y<80){

        c.targetX=
            80+
            Math.random()*940;

        c.targetY=H+80;

    }

    else{

        c.targetX=
            80+
            Math.random()*940;

        c.targetY=-80;

    }

    c.passingTarget={
        x:c.targetX,
        y:c.targetY
    };

}


/* =========================================================
   BÀN
========================================================= */

function freeTable(){

    const free=
        tables.filter(
            t=>!t.occupied
        );

    if(
        free.length===0
    ){

        return null;

    }

    return randomItem(
        free
    );

}


/* =========================================================
   TARGET KHÁCH VÀO QUÁN
========================================================= */

function setShopTarget(c){

    /*
       Đi vào khu vực trước sạp,
       sau đó mới tìm bàn.
    */

    c.targetX=
        300+
        Math.random()*400;

    c.targetY=
        315;

}


/* =========================================================
   MOVE CUSTOMER
========================================================= */

function moveCustomer(c){

    const dx=
        c.targetX-c.x;

    const dy=
        c.targetY-c.y;

    const distance=
        Math.hypot(dx,dy);


    if(
        distance<5
    ){

        return true;

    }


    let vx=
        dx/distance*
        c.speed;

    let vy=
        dy/distance*
        c.speed;


    /*
       TRÁNH KHÁCH KHÁC
    */

    for(
        const other
        of customers
    ){

        if(
            other===c ||
            other.state==="leaving"
        ){

            continue;

        }

        const ox=
            c.x-other.x;

        const oy=
            c.y-other.y;

        const d=
            Math.hypot(
                ox,
                oy
            );

        if(
            d<45 &&
            d>0
        ){

            const force=
                (45-d)/45;

            vx+=
                ox/d*
                force*
                1.2;

            vy+=
                oy/d*
                force*
                1.2;

        }

    }


    const length=
        Math.hypot(
            vx,
            vy
        );

    if(
        length>0
    ){

        vx=
            vx/length*
            c.speed;

        vy=
            vy/length*
            c.speed;

    }


    const nx=
        c.x+vx;

    const ny=
        c.y+vy;


    /*
       Không đi xuyên vật cản
    */

    if(
        !blocked(
            nx,
            ny,
            14
        ) &&
        !customerBlocked(
            nx,
            ny,
            c
        )
    ){

        c.x=nx;

        c.y=ny;

        return false;

    }


    /*
       Nếu bị chặn,
       thử đi ngang.
    */

    const nx2=
        c.x+vx;

    const ny2=
        c.y;

    if(
        !blocked(
            nx2,
            ny2,
            14
        ) &&
        !customerBlocked(
            nx2,
            ny2,
            c
        )
    ){

        c.x=nx2;

        return false;

    }


    const nx3=
        c.x;

    const ny3=
        c.y+vy;

    if(
        !blocked(
            nx3,
            ny3,
            14
        ) &&
        !customerBlocked(
            nx3,
            ny3,
            c
        )
    ){

        c.y=ny3;

        return false;

    }


    /*
       Nếu vẫn bị kẹt,
       đổi target.
    */

    c.targetX=
        Math.max(
            20,
            Math.min(
                W-20,
                c.x+
                (Math.random()-.5)*
                150
            )
        );

    c.targetY=
        Math.max(
            20,
            Math.min(
                H-20,
                c.y+
                (Math.random()-.5)*
                150
            )
        );

    return false;

}


/* =========================================================
   CUSTOMER AI
========================================================= */

function updateCustomer(
    c,
    dt
){

    c.timer+=dt;


    /* ======================
       ĐI BỘ
    ====================== */

    if(
        c.state==="walking"
    ){

        moveCustomer(c);


        /*
           KHÁCH QUA ĐƯỜNG

           Khi ra khỏi map -> xóa
        */

        if(
            !c.wantsShop
        ){

            if(
                c.x<-60 ||
                c.x>W+60 ||
                c.y<-60 ||
                c.y>H+60
            ){

                removeCustomer(c);

            }

            return;

        }


        /*
           KHÁCH MUỐN VÀO QUÁN
        */

        const nearShop=

            c.x>300 &&
            c.x<800 &&
            c.y>280 &&
            c.y<350;


        if(
            nearShop
        ){

            const table=
                freeTable();


            if(table){

                c.table=
                    table;

                table.occupied=true;

                table.customer=c;

                c.targetX=
                    table.x+
                    table.w/2;

                c.targetY=
                    table.y+
                    table.h/2;

                c.state=
                    "finding_table";

                c.timer=0;

            }
            else{

                /*
                   Hết bàn.

                   Không đứng chết
                   ở bên phải map.

                   Chờ tối đa 5 giây,
                   sau đó rời quán.
                */

                if(
                    c.timer>5000
                ){

                    leaveCustomer(c);

                }

            }

        }

    }


    /* ======================
       TÌM BÀN
    ====================== */

    else if(
        c.state==="finding_table"
    ){

        moveCustomer(c);


        const d=
            Math.hypot(
                c.targetX-c.x,
                c.targetY-c.y
            );


        if(
            d<10
        ){

            c.state="sitting";

            c.timer=0;

        }

    }


    /* ======================
       NGỒI
    ====================== */

    else if(
        c.state==="sitting"
    ){

        if(
            c.timer>1000
        ){

            c.state="ordering";

            c.timer=0;

        }

    }


    /* ======================
       GỌI MÓN
    ====================== */

    else if(
        c.state==="ordering"
    ){

        if(
            c.timer>1000
        ){

            const dishes=[

                {
                    name:"Phần cơ bản",
                    price:350000
                },

                {
                    name:"Thịt + rau",
                    price:500000
                },

                {
                    name:"Đặc biệt",
                    price:650000
                }

            ];


            c.order=
                randomItem(
                    dishes
                );


            c.state=
                "waiting_food";

            c.timer=0;

        }

    }


    /* ======================
       CHỜ ĐỒ ĂN
    ====================== */

    else if(
        c.state==="waiting_food"
    ){

        c.patience-=
            dt/1000;


        if(
            c.patience<=0
        ){

            game.reputation-=2;

            showMessage(
                "Một khách mất kiên nhẫn và bỏ đi!"
            );

            leaveCustomer(c);

        }

    }


    /* ======================
       ĂN
    ====================== */

    else if(
        c.state==="eating"
    ){

        if(
            c.timer>5000
        ){

            c.state="paying";

            c.timer=0;

        }

    }


    /* ======================
       THANH TOÁN
    ====================== */

    else if(
        c.state==="paying"
    ){

        if(
            c.timer>1000
        ){

            const price=
                c.order?
                c.order.price:
                350000;


            game.money+=price;

            game.reputation+=1;

            game.customersServed++;


            showMessage(
                "+"+
                formatMoney(price)
            );


            leaveCustomer(c);

        }

    }


    /* ======================
       RỜI QUÁN
    ====================== */

    else if(
        c.state==="leaving"
    ){

        moveCustomer(c);


        if(
            c.x<-70 ||
            c.x>W+70 ||
            c.y<-70 ||
            c.y>H+70
        ){

            removeCustomer(c);

        }

    }

}


/* =========================================================
   LEAVE CUSTOMER
========================================================= */

function leaveCustomer(c){

    if(
        c.table
    ){

        c.table.occupied=false;

        c.table.customer=null;

        c.table=null;

    }


    c.state="leaving";


    /*
       Chọn lối ra gần nhất
    */

    const distances=[

        {
            x:-80,
            y:c.y,
            d:c.x
        },

        {
            x:W+80,
            y:c.y,
            d:W-c.x
        },

        {
            x:c.x,
            y:-80,
            d:c.y
        },

        {
            x:c.x,
            y:H+80,
            d:H-c.y
        }

    ];


    distances.sort(
        (a,b)=>a.d-b.d
    );


    c.targetX=
        distances[0].x;

    c.targetY=
        distances[0].y;

}


/* =========================================================
   REMOVE
========================================================= */

function removeCustomer(c){

    if(
        c.table
    ){

        c.table.occupied=false;

        c.table.customer=null;

    }


    customers=
        customers.filter(
            x=>x!==c
        );

}


/* =========================================================
   SERVE
========================================================= */

function serveNearestCustomer(){

    let nearest=null;

    let nearestDistance=Infinity;


    for(
        const c
        of customers
    ){

        if(
            c.state!=="waiting_food"
        ){

            continue;

        }


        const d=
            dist(
                player,
                c
            );


        if(
            d<nearestDistance
        ){

            nearestDistance=d;

            nearest=c;

        }

    }


    if(
        !nearest
    ){

        showMessage(
            "Không có khách cần phục vụ."
        );

        return;

    }


    if(
        nearestDistance>110
    ){

        showMessage(
            "Hãy lại gần khách hơn."
        );

        return;

    }


    nearest.state="eating";

    nearest.timer=0;

    showMessage(
        "Đã phục vụ: "+
        nearest.order.name
    );

}


/* =========================================================
   PLAYER
========================================================= */

function updatePlayer(){

    let dx=0;

    let dy=0;


    if(
        keys["w"] ||
        keys["arrowup"]
    ){

        dy--;

        player.direction="up";

    }


    if(
        keys["s"] ||
        keys["arrowdown"]
    ){

        dy++;

        player.direction="down";

    }


    if(
        keys["a"] ||
        keys["arrowleft"]
    ){

        dx--;

        player.direction="left";

    }


    if(
        keys["d"] ||
        keys["arrowright"]
    ){

        dx++;

        player.direction="right";

    }


    if(
        dx!==0 ||
        dy!==0
    ){

        const len=
            Math.hypot(
                dx,
                dy
            );

        dx/=len;

        dy/=len;

    }


    const nx=
        player.x+
        dx*
        player.speed;

    const ny=
        player.y+
        dy*
        player.speed;


    if(
        nx>15 &&
        nx<W-15 &&
        !blocked(
            nx,
            player.y,
            player.radius
        )
    ){

        player.x=nx;

    }


    if(
        ny>15 &&
        ny<H-15 &&
        !blocked(
            player.x,
            ny,
            player.radius
        )
    ){

        player.y=ny;

    }

}


/* =========================================================
   TIME
========================================================= */

let timeAccumulator=0;


function updateTime(dt){

    timeAccumulator+=dt;


    if(
        timeAccumulator>=1000
    ){

        /*
           1 giây thật =
           1 phút trong game
        */

        game.minute++;

        timeAccumulator=0;


        if(
            game.minute>=22*60
        ){

            endDay();

        }

    }

}


/* =========================================================
   SPAWN
========================================================= */

function updateSpawn(dt){

    game.customerTimer+=dt;


    if(
        game.customerTimer>=
        game.nextCustomer
    ){

        spawnCustomer();

        game.customerTimer=0;


        /*
           Spawn nhanh hơn bản cũ.
        */

        game.nextCustomer=
            450+
            Math.random()*1400;

    }

}


/* =========================================================
   END DAY
========================================================= */

function endDay(){

    if(
        !game.running
    ){

        return;

    }


    game.day++;


    if(
        game.day>30
    ){

        game.running=false;

        alert(
            "KẾT THÚC 30 NGÀY\n\n"+
            "Tiền: "+
            formatMoney(
                game.money
            )+
            "\n"+
            "Nợ còn lại: "+
            formatMoney(
                game.debt
            )
        );

        return;

    }


    game.minute=8*60;


    game.money-=400000;


    if(
        game.money<0
    ){

        game.money=0;

    }


    /*
       Xóa khách còn lại khi
       sang ngày mới.
    */

    for(
        const c
        of customers
    ){

        if(
            c.table
        ){

            c.table.occupied=false;

            c.table.customer=null;

        }

    }


    customers=[];


    showMessage(
        "Bắt đầu ngày "+
        game.day
    );

}


/* =========================================================
   DRAW BACKGROUND
========================================================= */

function drawBackground(){

    /*
       ============================================
       PHẦN DƯỚI
       ============================================

       GỌI DUY NHẤT:

       15.jpg
    */


    if(
        bottomBackground.complete &&
        bottomBackground.naturalWidth>0
    ){

        ctx.drawImage(
            bottomBackground,
            0,
            170,
            W,
            H-170
        );

    }
    else{

        /*
           Nếu 15.jpg chưa có,
           dùng màu dự phòng.
        */

        ctx.fillStyle="#7faa69";

        ctx.fillRect(
            0,
            170,
            W,
            H-170
        );

    }


    /*
       ============================================
       PHẦN TRÊN
       ============================================

       CHỈ GỌI 1 ẢNH.

       top-background.png

       Bạn tự tạo ảnh vừa khít.
    */


    if(
        topBackground.complete &&
        topBackground.naturalWidth>0
    ){

        ctx.drawImage(
            topBackground,
            0,
            0,
            W,
            175
        );

    }
    else{

        /*
           Dự phòng nếu chưa có ảnh.
        */

        const sky=
            ctx.createLinearGradient(
                0,
                0,
                0,
                175
            );

        sky.addColorStop(
            0,
            "#73bce8"
        );

        sky.addColorStop(
            1,
            "#cceeff"
        );

        ctx.fillStyle=sky;

        ctx.fillRect(
            0,
            0,
            W,
            175
        );

    }

}


/* =========================================================
   DRAW SHOP
========================================================= */

function drawShop(){

    /*
       QUÁN ĂN Ở BÊN TRÁI
    */

    if(
        shopImage.complete &&
        shopImage.naturalWidth>0
    ){

        ctx.drawImage(

            SHOP.y,
            SHOP.w,
            SHOP.h
        );

    }

        */

        ctx.fillRect(
            SHOP.x,
            SHOP.y,

            SHOP.h
        );


        ctx.fillStyle="#b83232";

        ctx.fillRect(
            SHOP.x-15,
            SHOP.y-20,
            SHOP.w+30,
            35
        );


        ctx.fillStyle="#f0c35b";

        ctx.fillRect(

        );

        );

}


/* =========================================================
   DRAW WAREHOUSE
========================================================= */

function drawWarehouse(){

       KHO NHẬP HÀNG Ở BÊN PHẢI
    */

    if(

    ){

        */

        );

            35
        );


        ctx.fillStyle="#e3b952";

        ctx.fillRect(

            WAREHOUSE.y+25,
            WAREHOUSE.w-60,
            45
        );

        ctx.font=
            "bold 18px Arial";

            WAREHOUSE.w/2,

        );

    }

}


/* =========================================================
   DRAW TABLES
========================================================= */

function drawTables(){

    for(
        const table
        of tables
    ){

        ctx.fillStyle=
            table.occupied?
            "#8c623d":
            "#a87948";


        ctx.fillRect(
            table.x,
            table.y,
            table.w,
            table.h
        );


        ctx.fillStyle="#5b3c26";


        ctx.fillRect(
            table.x+10,
            table.y+table.h,
            8,
            18
        );


        ctx.fillRect(
            table.x+
            table.w-18,
            table.y+table.h,
            8,
            18
        );

    }

}


/* =========================================================
   DRAW CUSTOMER
========================================================= */

function drawCustomer(c){

    /*
       Bóng
    */

    ctx.fillStyle=
        "rgba(0,0,0,.22)";


    ctx.beginPath();

    ctx.ellipse(
        c.x,
        c.y+17,
        17,
        7,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       Cơ thể
    */

    ctx.fillStyle=
        c.color;


    ctx.beginPath();

    ctx.arc(
        c.x,
        c.y,
        15,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       Đầu
    */

    ctx.fillStyle="#dfaa82";


    ctx.beginPath();

    ctx.arc(
        c.x,
        c.y-12,
        9,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       Khách cần phục vụ
    */

    if(
        c.state==="waiting_food"
    ){

        ctx.fillStyle="#ffd34f";


        ctx.beginPath();

        ctx.arc(
            c.x+21,
            c.y-26,
            10,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.fillStyle="#111";

        ctx.font=
            "bold 13px Arial";

        ctx.textAlign="center";

        ctx.fillText(
            "!",
            c.x+21,
            c.y-22
        );

    }


    /*
       VIP
    */

    if(
        c.type==="rich"
    ){

        ctx.fillStyle="#ffe05a";

        ctx.font=
            "bold 10px Arial";

        ctx.textAlign="center";

        ctx.fillText(
            "VIP",
            c.x,
            c.y-29
        );

    }

}


/* =========================================================
   DRAW PLAYER
========================================================= */

function drawPlayer(){

    /*
       Bóng
    */

    ctx.fillStyle=
        "rgba(0,0,0,.25)";


    ctx.beginPath();

    ctx.ellipse(
        player.x,
        player.y+21,
        19,
        7,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       Chưa có ảnh:
       dùng hình tạm.
    */

    ctx.fillStyle="#244f76";

    ctx.fillRect(
        player.x-14,
        player.y-2,
        28,
        30
    );


    ctx.fillStyle="#dba77e";

    ctx.beginPath();

    ctx.arc(
        player.x,
        player.y-12,
        13,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle="#222";

    ctx.beginPath();

    ctx.arc(
        player.x,
        player.y-18,
        12,
        Math.PI,
        Math.PI*2
    );

    ctx.fill();


    /*
       Tên
    */

    ctx.fillStyle="white";

    ctx.font=
        "bold 12px Arial";

    ctx.textAlign="center";

    ctx.fillText(
        "Đạt Trung",
        player.x,
        player.y+43
    );

}


/* =========================================================
   DRAW
========================================================= */

function draw(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    /*
       Nền
    */

    drawBackground();


    /*
       Hai công trình
    */

    drawShop();

    drawWarehouse();


    /*
       Bàn
    */

    drawTables();


    /*
       NPC
    */

    for(
        const c
        of customers
    ){

        drawCustomer(c);

    }


    /*
       Player
    */

    drawPlayer();

}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

    document.getElementById(
        "day"
    ).textContent=
        game.day;


    const hour=
        Math.floor(
            game.minute/60
        );

    const minute=
        game.minute%60;


    document.getElementById(
        "time"
    ).textContent=
        String(hour).padStart(2,"0")+
        ":"+
        String(minute).padStart(2,"0");


    document.getElementById(
        "money"
    ).textContent=
        formatMoney(
            game.money
        );


    document.getElementById(
        "debt"
    ).textContent=
        formatMoney(
            game.debt
        );


    document.getElementById(
        "rep"
    ).textContent=
        Math.max(
            0,
            Math.round(
                game.reputation
            )
        );


    document.getElementById(
        "customers"
    ).textContent=
        customers.length;

}


/* =========================================================
   MONEY
========================================================= */

function formatMoney(
    value
){

    return Math.round(value)
        .toLocaleString("vi-VN")
        +"đ";

}


/* =========================================================
   MESSAGE
========================================================= */

let messageTimer=null;


function showMessage(
    text
){

    const element=
        document.getElementById(
            "message"
        );


    element.textContent=
        text;


    element.classList.add(
        "show"
    );


    clearTimeout(
        messageTimer
    );


    messageTimer=
        setTimeout(
            ()=>{

                element.classList.remove(
                    "show"
                );

            },
            2200
        );

}


/* =========================================================
   INTERACTION
========================================================= */

function updateInteraction(){

    let near=false;


    for(
        const c
        of customers
    ){

        if(
            c.state===
            "waiting_food" &&
            dist(player,c)<110
        ){

            near=true;

            break;

        }

    }


    const interaction=
        document.getElementById(
            "interaction"
        );

    const serve=
        document.getElementById(
            "serveBtn"
        );


    if(near){

        interaction.style.display=
            "block";

        serve.style.display=
            "block";

    }
    else{

        interaction.style.display=
            "none";

        serve.style.display=
            "none";

    }

}


/* =========================================================
   START GAME
========================================================= */

function startGame(){

    const input=
        document.getElementById(
            "playerName"
        );


    game.name=
        input.value.trim() ||
        "Người chơi";


    document.getElementById(
        "startScreen"
    ).style.display=
        "none";


    game.running=true;


    /*
       Spawn ban đầu nhiều hơn.
    */

    for(
        let i=0;
        i<6;
        i++
    ){

        setTimeout(
            ()=>{
                spawnCustomer();
            },
            i*350
        );

    }


    showMessage(
        "Một ngày mới bắt đầu!"
    );

}


/* =========================================================
   SERVE BUTTON
========================================================= */

document
    .getElementById("serveBtn")
    .addEventListener(
        "click",
        serveNearestCustomer
    );


/* =========================================================
   MAIN LOOP
========================================================= */

let lastTime=
    performance.now();


function gameLoop(now){

    const dt=
        Math.min(
            now-lastTime,
            50
        );


    lastTime=now;


    if(
        game.running
    ){

        updatePlayer();

        updateTime(dt);

        updateSpawn(dt);


        for(
            const customer
            of [...customers]
        ){

            updateCustomer(
                customer,
                dt
            );

        }

    }


    draw();

    updateHUD();

    updateInteraction();


    requestAnimationFrame(
        gameLoop
    );

}


requestAnimationFrame(
    gameLoop
);

</script>
