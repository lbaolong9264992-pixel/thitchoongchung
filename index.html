<script>

/* =========================================================

========================================================= */

const game={

/* =========================================================

/* =========================================================

========================================================= */

const keys={};

window.addEventListener("keydown",e=>{

    const key=e.key.toLowerCase();

    keys[key]=true;

    if(
        key==="arrowup" ||
        key==="arrowdown" ||
        key==="arrowleft" ||
        key==="arrowright" ||
        key===" "
    ){
        e.preventDefault();
    }

    if(key==="e"){

        interact();

    }

});


window.addEventListener("keyup",e=>{

    keys[e.key.toLowerCase()]=false;

});


/* =========================================================
   MOBILE MOVEMENT
========================================================= */

const mobileMap={

    up:"arrowup",
    down:"arrowdown",
    left:"arrowleft",
    right:"arrowright"

};


for(const id in mobileMap){

    const button=
        document.getElementById(id);

    const key=mobileMap[id];

    button.addEventListener(
        "pointerdown",
        e=>{

            e.preventDefault();

            keys[key]=true;

        }
    );

    button.addEventListener(
        "pointerup",
        e=>{

            e.preventDefault();

            keys[key]=false;

        }
    );

    button.addEventListener(
        "pointercancel",
        ()=>{

            keys[key]=false;

        }
    );

    button.addEventListener(
        "pointerleave",
        ()=>{

            keys[key]=false;

        }
    );

}


document
    .getElementById("actionBtn")
    .addEventListener(

/* =========================================================

/*

   │──────────── ĐƯỜNG ─────────────────────│
   │                                         │
   │              KHU BÀN ĂN                 │
   │                                         │
   └─────────────────────────────────────────┘
*/


const shop={

};

/* đường */

/* sân quán */

const restaurantY=430;


/* =========================================================

const tables=[

    },

    },

    },

    {

    },

    {

    },

    {

/* =========================================================

*/

const spawnPoints=[

    },

    {

    },

    },

    }

/* =========================================================

const customerTypes=[

    },

const dialogues={

    ]

};


/* =========================================================
   DISTANCE
========================================================= */

function distance(a,b){

    return Math.hypot(
        a.x-b.x,
        a.y-b.y
    );

}


/* =========================================================
   COLLISION
========================================================= */

function circleRectCollision(
    x,
    y,
    r,
    rect
){

    const closestX=
        Math.max(
            rect.x,
            Math.min(
                x,
                rect.x+rect.w
            )
        );

    const closestY=
        Math.max(
            rect.y,
            Math.min(
                y,
                rect.y+rect.h
            )
        );

    const dx=x-closestX;
    const dy=y-closestY;

    return dx*dx+dy*dy<r*r;

}


function blocked(x,y){

    for(const o of obstacles){

        if(
            circleRectCollision(
                x,
                y,
                14,
                o
            )
        ){

            return true;

        }

    }

    return false;

}


/* =========================================================
   FREE TABLE
========================================================= */

function findFreeTable(){

    const free=
        tables.filter(
            t=>!t.occupied
        );

    if(!free.length){

        return null;

    }

    return free[
        Math.floor(
            Math.random()*free.length
        )
    ];

}


/* =========================================================
   SPAWN CUSTOMER
========================================================= */

function spawnCustomer(){

    /*
       Tối đa 5 khách cùng lúc.
    */

    if(
        customers.length>=game.maxCustomers
    ){

        return;

    }


    const spawn=
        spawnPoints[
            Math.floor(
                Math.random()*spawnPoints.length
            )
        ];


    const base=
        customerTypes[
            Math.floor(
                Math.random()*customerTypes.length
            )
        ];


    /*
       70% vào quán.
       30% đi ngang.
    */

    const wantsShop=
        Math.random()<0.70;


    const c={

        id:
            Date.now()+
            Math.random(),

        type:base.type,

        color:base.color,

        speed:base.speed,

        patience:base.patience,

        maxPatience:base.patience,

        money:base.money,

        x:spawn.x,

        y:spawn.y,

        targetX:spawn.x,

        targetY:spawn.y,

        state:"walking",

        wantsShop,

        table:null,

        timer:0,

        dialogueIndex:0,

        dialogueOpen:false,

        order:null,

        exitX:null,

        exitY:null,

        walkTargetTimer:0

    };


    if(wantsShop){

        /*
           Đi vào cổng quán.
        */

        c.targetX=
            550+
            (Math.random()-.5)*100;

        c.targetY=315;

    }else{

        /*
           Khách đi ngang theo đường.
        */

        if(
            spawn.side==="left"
        ){

            c.targetX=
                1150;

            c.targetY=
                spawn.y;

        }else if(
            spawn.side==="right"
        ){

            c.targetX=
                -50;

            c.targetY=
                spawn.y;

        }else{

            c.targetX=
                spawn.x;

            c.targetY=
                -50;

        }

    }


    customers.push(c);

    game.totalCustomers++;

}


/* =========================================================
   CUSTOMER MOVEMENT
========================================================= */

function moveCustomer(c){

    const dx=
        c.targetX-c.x;

    const dy=
        c.targetY-c.y;

    const dist=
        Math.hypot(dx,dy);


    if(dist<5){

        return true;

    }


    const vx=
        dx/dist*c.speed;

    const vy=
        dy/dist*c.speed;


    const nx=
        c.x+vx;

    const ny=
        c.y+vy;


    if(!blocked(nx,ny)){

        c.x=nx;
        c.y=ny;

    }else{

        /*
           Đi vòng khi gặp vật cản.
        */

        c.targetX=
            c.x+
            (Math.random()-.5)*100;

        c.targetY=
            c.y+
            (Math.random()-.5)*100;

    }

    return false;

}


/* =========================================================
   CUSTOMER AI
========================================================= */

function updateCustomer(c,dt){

    c.timer+=dt;


    switch(c.state){


        /* =======================
           ĐI BỘ
        ======================= */

        case"walking":{

            moveCustomer(c);


            /*
               Khách muốn ăn tới sân quán.
            */

            if(
                c.wantsShop &&
                c.x>430 &&
                c.x<700 &&
                c.y>285 &&
                c.y<350
            ){

                const table=
                    findFreeTable();


                if(table){

                    c.table=table;

                    table.occupied=true;
                    table.customer=c;


                    c.targetX=
                        table.x+
                        table.w/2;

                    c.targetY=
                        table.y+
                        table.h/2;


                    c.state=
                        "finding_table";

                    c.timer=0;

                }

            }


            /*
               Khách đi ngang biến mất.
            */

            if(
                !c.wantsShop &&
                (
                    c.x<-60 ||
                    c.x>1160 ||
                    c.y<-60 ||
                    c.y>680
                )
            ){

                removeCustomer(c);

            }


            break;

        }


        /* =======================
           TÌM BÀN
        ======================= */

        case"finding_table":{

            if(
                moveCustomer(c)
            ){

                c.state="sitting";

                c.timer=0;

            }

            break;

        }


        /* =======================
           NGỒI
        ======================= */

        case"sitting":{

            if(c.timer>900){

                c.state="ready_dialogue";

                c.timer=0;

            }

            break;

        }


        /* =======================
           CHỜ GỌI MÓN
        ======================= */

        case"ready_dialogue":{

            /*
               Không tự chuyển.
               Người chơi phải tới gần
               và bấm E.
            */

            if(
                c.timer>10000
            ){

                c.state="waiting_food";

                c.timer=0;

            }

            break;

        }


        /* =======================
           ĐANG HỘI THOẠI
        ======================= */

        case"dialogue":{

            /*
               Game dừng AI khách
               trong lúc nói chuyện.
            */

            break;

        }


        /* =======================
           CHỜ MÓN
        ======================= */

        case"waiting_food":{

            c.patience-=dt/1000;


            if(c.patience<=0){

                game.reputation-=2;

                showMessage(
                    "Khách mất kiên nhẫn và rời đi."
                );

                leaveCustomer(c);

            }

            break;

        }


        /* =======================
           ĂN
        ======================= */

        case"eating":{

            if(c.timer>5000){

                c.state="paying";

                c.timer=0;

            }

            break;

        }


        /* =======================
           THANH TOÁN
        ======================= */

        case"paying":{

            if(c.timer>1000){

                const price=
                    c.order?
                    c.order.price:
                    c.money;


                game.money+=price;

                game.reputation+=1;

                game.customersServed++;


                showMessage(
                    "+"+
                    formatMoney(price)+
                    " từ khách"
                );


                c.state="leaving";

                c.exitX=
                    Math.random()<.5?
                    -70:
                    1170;

                c.exitY=
                    320+
                    Math.random()*90;


                c.targetX=c.exitX;
                c.targetY=c.exitY;

                c.timer=0;

            }

            break;

        }


        /* =======================
           RỜI QUÁN
        ======================= */

        case"leaving":{

            moveCustomer(c);


            if(
                c.x<-70 ||
                c.x>1170 ||
                c.y<-70 ||
                c.y>680
            ){

                removeCustomer(c);

            }

            break;

        }

    }

}


/* =========================================================
   INTERACTION
========================================================= */

function getNearestInteractable(){

    let nearest=null;

    let best=Infinity;


    for(const c of customers){

        if(
            c.state!=="ready_dialogue" &&
            c.state!=="waiting_food"
        ){

            continue;

        }


        const d=
            distance(
                player,
                c
            );


        if(
            d<best &&
            d<90
        ){

            best=d;

            nearest=c;

        }

    }


    return nearest;

}


/* =========================================================
   INTERACT
========================================================= */

function interact(){

    if(!game.running){

        return;

    }


    /*
       Nếu đang hội thoại
       thì E = câu tiếp theo.
    */

    if(dialogueCustomer){

        nextDialogue();

        return;

    }


    const c=
        getNearestInteractable();


    if(!c){

        return;

    }


    if(
        c.state==="ready_dialogue"
    ){

        startDialogue(c);

        return;

    }


    if(
        c.state==="waiting_food"
    ){

        serveCustomer(c);

    }

}


/* =========================================================
   DIALOGUE
========================================================= */

let dialogueCustomer=null;


function startDialogue(c){

    dialogueCustomer=c;

    c.state="dialogue";

    c.dialogueIndex=0;

    document
        .getElementById("dialogue")
        .style.display="block";

    showDialogueLine();

}


function showDialogueLine(){

    if(!dialogueCustomer){

        return;

    }


    const c=
        dialogueCustomer;


    const lines=
        dialogues[c.type] ||
        dialogues.male;


    const name=
        c.type==="vip"
        ?"Khách VIP"
        :"Khách hàng";


    document
        .getElementById("dialogueName")
        .textContent=name;


    document
        .getElementById("dialogueText")
        .textContent=
            lines[c.dialogueIndex];


    document
        .getElementById("dialogueHint")
        .textContent=
            "E - tiếp tục";


}


function nextDialogue(){

    if(!dialogueCustomer){

        return;

    }


    const c=
        dialogueCustomer;


    const lines=
        dialogues[c.type] ||
        dialogues.male;


    c.dialogueIndex++;


    if(
        c.dialogueIndex>=lines.length
    ){

        finishDialogue();

        return;

    }


    showDialogueLine();

}


/* =========================================================
   FINISH DIALOGUE
========================================================= */

function finishDialogue(){

    const c=
        dialogueCustomer;


    dialogueCustomer=null;


    document
        .getElementById("dialogue")
        .style.display="none";


    /*
       Chọn món theo loại khách.
    */

    const dishes=[

        {
            name:"Phần cơ bản",
            price:350000
        },

        {
            name:"Thịt + rau",
            price:500000
        },

        {
            name:"Phần đặc biệt",
            price:650000
        }

    ];


    c.order=
        dishes[
            Math.floor(
                Math.random()*dishes.length
            )
        ];


    c.state="waiting_food";

    c.timer=0;

    showMessage(
        "Khách gọi: "+
        c.order.name
    );

}


/* =========================================================
   SERVE
========================================================= */

function serveCustomer(c){

    if(
        distance(player,c)>95
    ){

        showMessage(
            "Hãy lại gần khách hơn."
        );

        return;

    }


    c.state="eating";

    c.timer=0;

    showMessage(

    );

}


/* =========================================================
   REMOVE
========================================================= */

function removeCustomer(c){

    if(c.table){

        c.table.occupied=false;

        c.table.customer=null;

        c.table=null;

    }


    customers=
        customers.filter(
            x=>x!==c
        );

}


/* =========================================================
   LEAVE
========================================================= */

function leaveCustomer(c){

    if(c.table){

        c.table.occupied=false;

        c.table.customer=null;

        c.table=null;

    }


    c.state="leaving";


    c.exitX=
        Math.random()<.5?
        -70:
        1170;

    c.exitY=
        320+
        Math.random()*90;


    c.targetX=c.exitX;

    c.targetY=c.exitY;

}


/* =========================================================
   PLAYER
========================================================= */

function updatePlayer(){

    let dx=0;
    let dy=0;


    if(
        keys["w"] ||
        keys["arrowup"]
    ){

        dy--;

        player.direction="up";

    }


    if(
        keys["s"] ||
        keys["arrowdown"]
    ){

        dy++;

        player.direction="down";

    }


    if(
        keys["a"] ||
        keys["arrowleft"]
    ){

        dx--;

        player.direction="left";

    }


    if(
        keys["d"] ||
        keys["arrowright"]
    ){

        dx++;

        player.direction="right";

    }


    if(dx!==0 || dy!==0){

        const len=
            Math.hypot(dx,dy);

        dx/=len;
        dy/=len;

    }


    const nx=
        player.x+
        dx*player.speed;


    const ny=
        player.y+
        dy*player.speed;


    if(
        nx>18 &&
        nx<W-18 &&
        !blocked(nx,player.y)
    ){

        player.x=nx;

    }


    if(
        ny>18 &&
        ny<H-18 &&
        !blocked(player.x,ny)
    ){

        player.y=ny;

    }

}


/* =========================================================
   TIME
========================================================= */

let timeAccumulator=0;


function updateTime(dt){

    timeAccumulator+=dt;


    /*
       1 giây thật = 1 phút game
    */

    if(timeAccumulator>=1000){

        timeAccumulator-=1000;

        game.minute++;


        if(
            game.minute>=22*60
        ){

            endDay();

        }

    }

}


/* =========================================================
   SPAWN
========================================================= */

function updateSpawn(dt){

    game.customerTimer+=dt;


    if(
        game.customerTimer>=game.nextCustomer
    ){

        spawnCustomer();

        game.customerTimer=0;


        /*
           Spawn chậm hơn.
        */

        game.nextCustomer=
            5000+
            Math.random()*5000;

    }

}


/* =========================================================
   END DAY
========================================================= */

function endDay(){

    if(!game.running){

        return;

    }


    game.day++;


    if(game.day>30){

        game.running=false;

        showMessage(
            "Đã hoàn thành 30 ngày!"
        );

        setTimeout(()=>{

            alert(
                "THỊT CHÓ ÔNG TRUNG\n\n"+
                "Kết thúc 30 ngày\n\n"+
                "Tiền: "+
                formatMoney(game.money)+
                "\nNợ: "+
                formatMoney(game.debt)
            );

        },500);

        return;

    }


    game.minute=8*60;

    game.money-=400000;


    if(game.money<0){

        game.money=0;

    }


    showMessage(
        "Bắt đầu ngày "+
        game.day
    );

}


/* =========================================================
   UPDATE
========================================================= */

function update(dt){

    if(!game.running){

        return;

    }


    updatePlayer();

    updateTime(dt);

    updateSpawn(dt);


    for(
        const c of [...customers]
    ){

        if(
            c!==dialogueCustomer
        ){

            updateCustomer(c,dt);

        }

    }

}


/* =========================================================
   DRAW MAP
========================================================= */

function drawMap(){

    /*
       Nền cỏ
    */

    ctx.fillStyle="#91a276";

    ctx.fillRect(
        0,0,W,H
    );


    /*
       Khu sân quán
    */

    ctx.fillStyle="#b8a98b";

    ctx.fillRect(
        0,
        250,
        1100,
        50
    );


    /*
       ĐƯỜNG
    */

    ctx.fillStyle="#55585a";

    ctx.fillRect(
        road.x,
        road.y,
        road.w,
        road.h
    );


    /*
       Vỉa hè
    */

    ctx.fillStyle="#bcb8a9";

    ctx.fillRect(
        0,
        280,
        W,
        20
    );

    ctx.fillRect(
        0,
        430,
        W,
        20
    );


    /*
       Vạch giữa đường
    */

    ctx.strokeStyle="#e0c75e";

    ctx.lineWidth=4;

    ctx.setLineDash([35,25]);

    ctx.beginPath();

    ctx.moveTo(
        0,
        365
    );

    ctx.lineTo(
        W,
        365
    );

    ctx.stroke();

    ctx.setLineDash([]);


    /*
       Khu ăn uống
    */

    ctx.fillStyle="#c8b58e";

    ctx.fillRect(
        230,
        450,
        580,
        160
    );


    /*
       Viền sân
    */

    ctx.strokeStyle="#9c8965";

    ctx.lineWidth=3;

    ctx.strokeRect(
        230,
        450,
        580,
        160
    );


    /*
       Ô lát sân
    */

    ctx.strokeStyle="rgba(100,80,50,.15)";

    ctx.lineWidth=1;

    for(
        let x=230;
        x<810;
        x+=45
    ){

        ctx.beginPath();

        ctx.moveTo(x,450);

        ctx.lineTo(x,610);

        ctx.stroke();

    }

    for(
        let y=450;
        y<610;
        y+=40
    ){

        ctx.beginPath();

        ctx.moveTo(230,y);

        ctx.lineTo(810,y);

        ctx.stroke();

    }


    /*
       Cỏ trang trí
    */

    ctx.fillStyle="#72885c";

    for(let i=0;i<70;i++){

        const x=
            (i*173)%W;

        const y=
            (i*97)%H;


        if(
            y>290 &&
            y<450
        ){

            continue;

        }


        ctx.fillRect(
            x,
            y,
            2,
            5
        );

    }

}

    drawTables();

    */

    const entities=[
        ...customers,
        {
            isPlayer:true,
            y:player.y
        }
    ];


    entities.sort(
        (a,b)=>a.y-b.y
    );


    for(
        const entity of entities
    ){

        if(entity.isPlayer){

            drawPlayer();

        }else{

            drawCustomer(entity);

        }

    }

}


/* =========================================================
   ROUND RECT
========================================================= */

function roundRect(
    x,
    y,
    w,
    h,
    r
){

    ctx.beginPath();

    ctx.moveTo(
        x+r,
        y
    );

    ctx.lineTo(
        x+w-r,
        y
    );

    ctx.quadraticCurveTo(
        x+w,
        y,
        x+w,
        y+r
    );

    ctx.lineTo(
        x+w,
        y+h-r
    );

    ctx.quadraticCurveTo(
        x+w,
        y+h,
        x+w-r,
        y+h
    );

    ctx.lineTo(
        x+r,
        y+h
    );

    ctx.quadraticCurveTo(
        x,
        y+h,
        x,
        y+h-r
    );

    ctx.lineTo(
        x,
        y+r
    );

    ctx.quadraticCurveTo(
        x,
        y,
        x+r,
        y
    );

    ctx.closePath();

    ctx.fill();

}

        +"đ";

}


/* =========================================================
   MESSAGE
========================================================= */

let messageTimer=null;


function showMessage(text){

    const el=
        document.getElementById(
            "message"
        );


    el.textContent=text;

    el.classList.add("show");


    clearTimeout(
        messageTimer
    );


    messageTimer=
        setTimeout(
            ()=>{

                el.classList.remove(
                    "show"
                );

            },
            2300
        );

}


/* =========================================================
   INTERACTION UI
========================================================= */

function updateInteraction(){

    const interaction=
        document.getElementById(
            "interaction"
        );


    const actionBtn=
        document.getElementById(
            "actionBtn"
        );


    if(dialogueCustomer){

        interaction.style.display="none";

        actionBtn.textContent="E";

        return;

    }


    const c=
        getNearestInteractable();


    if(c){

        interaction.style.display="block";


        if(
            c.state==="ready_dialogue"
        ){

            interaction.textContent=
                "E - NÓI CHUYỆN";

            actionBtn.textContent="NÓI";

        }else{

            interaction.textContent=
                "E - PHỤC VỤ";

            actionBtn.textContent="PHỤC VỤ";

        }

    }else{

        interaction.style.display="none";

        actionBtn.textContent="E";

    }

}


/* =========================================================
   START
========================================================= */

function startGame(){

    const input=
        document.getElementById(
            "playerName"
        );


    game.name=
        input.value.trim()||
        "Người chơi";


    document
        .getElementById(
            "startScreen"
        )
        .style.display="none";


    game.running=true;


    /*
       Chỉ spawn 1 khách lúc đầu.
    */

    setTimeout(
        spawnCustomer,
        1200
    );


    showMessage(
        "Chào mừng đến với sạp của Đạt Trung!"
    );

}


/* =========================================================
   GAME LOOP
========================================================= */

let lastTime=
    performance.now();


function gameLoop(now){

    const dt=
        Math.min(
            now-lastTime,
            50
        );


    lastTime=now;


    update(dt);

    draw();

    updateHUD();

    updateInteraction();


    requestAnimationFrame(
        gameLoop
    );

}


requestAnimationFrame(
    gameLoop
);


/* =========================================================
   BACKGROUND SPAWN
========================================================= */

setInterval(()=>{

    if(!game.running){

        return;

    }


    /*
       Giảm mạnh mật độ khách.

       Bình thường:
       35% cơ hội spawn.

       Giờ cao điểm:
       50%.
    */

    const hour=
        Math.floor(
            game.minute/60
        );


    const chance=
        (
            hour>=11 &&
            hour<=13
        )
        ?0.50
        :0.35;


    if(
        Math.random()<chance
    ){

        spawnCustomer();

    }

},5000);

</script>
