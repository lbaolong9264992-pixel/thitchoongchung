<div id="game">

        <!-- =================================================

<script>
/* =========================================================
   THỊT CHÓ ÔNG TRUNG
   GAMEPLAY
   ========================================================= */

/*
=============================================================
  ASSETS
=============================================================

  GIỮ CÁC ẢNH CŨ CỦA BẠN Ở ĐÂY.

  Nền:
    15.jpg
    top-background.png

  Nhân vật:
    player.png

  Khách:
    customer1.png
    customer2.png
    customer3.png
    ...

  Bàn:
    table.png

  Đồ ăn:
    food.png

  Bạn có thể thay tên file ở đây bằng đúng tên ảnh cũ.
*/

const ASSETS = {

    player: "player.png",

    customerImages: [
        "customer1.png",
        "customer2.png",
        "customer3.png",
        "customer4.png",
        "customer5.png"
    ],

    table: "table.png",

    food: "food.png"

};


/* =========================================================
   CẤU HÌNH GAME
   ========================================================= */

const MAX_CUSTOMERS = 20;

/*
  Khách xuất hiện liên tục hơn:
  thời gian spawn ngẫu nhiên từ 0.7 -> 1.7 giây.
*/
const SPAWN_MIN = 700;
const SPAWN_MAX = 1700;

/*
  Thời gian khách không có bàn sẽ chờ.
*/
const NO_TABLE_WAIT = 5000;

/*
  Khách đi qua đường không vào quán.
*/
const WALK_SPEED = 1.3;


/* =========================================================
   TRẠNG THÁI
   ========================================================= */

let money = 10000000;
let debt = 360000000;
let reputation = 60;

let currentDay = 1;
let gameRunning = true;

let customers = [];
let tables = [];

let customerId = 0;

let player = {
    x:570,
    y:510,
    speed:4
};

let keys = {};


/* =========================================================
   DOM
   ========================================================= */

const world = document.getElementById("world");
const customersLayer = document.getElementById("customers");
const tablesLayer = document.getElementById("tables");

const moneyEl = document.getElementById("money");
const debtEl = document.getElementById("debt");
const dayEl = document.getElementById("day");
const repEl = document.getElementById("rep");

const messageEl = document.getElementById("message");

const playerEl = document.getElementById("player");


/* =========================================================
   TIỆN ÍCH
   ========================================================= */

function formatMoney(value){
    return value.toLocaleString("vi-VN") + "đ";
}

function random(min,max){
    return Math.random() * (max-min) + min;
}

function randomInt(min,max){
    return Math.floor(random(min,max+1));
}

function distance(a,b){
    return Math.sqrt(
        Math.pow(a.x-b.x,2) +
        Math.pow(a.y-b.y,2)
    );
}

function showMessage(text,time=2000){
    messageEl.textContent = text;
    messageEl.style.display = "block";

    setTimeout(()=>{
        messageEl.style.display = "none";
    },time);
}


/* =========================================================
   UI
   ========================================================= */

function updateUI(){

    moneyEl.textContent = formatMoney(money);
    debtEl.textContent = formatMoney(debt);

    dayEl.textContent =
        currentDay + " / 30";

    repEl.textContent =
        reputation;
}


/* =========================================================
   TẠO BÀN
   ========================================================= */

/*
  Bàn xếp ngang theo khu vực quán,
  không kéo dài map.
*/

const TABLE_POSITIONS = [

    {x:115,y:405},
    {x:205,y:405},
    {x:295,y:405},

    {x:115,y:500},
    {x:205,y:500},
    {x:295,y:500}

];

function createTables(){

    tablesLayer.innerHTML = "";
    tables = [];

    TABLE_POSITIONS.forEach((pos,index)=>{

        const el = document.createElement("div");

        el.className = "table";

        el.style.left = pos.x + "px";
        el.style.top = pos.y + "px";

        const img = document.createElement("img");

        img.className = "table-img";
        img.src = ASSETS.table;

        el.appendChild(img);

        const status =
            document.createElement("div");

        status.className =
            "table-status";

        status.textContent =
            "Đang dùng";

        el.appendChild(status);

        tablesLayer.appendChild(el);

        tables.push({

            id:index,

            x:pos.x + 38,
            y:pos.y + 38,

            occupied:false,

            customerId:null,

            element:el,

            status

        });

    });
}


/* =========================================================
   TÌM BÀN TRỐNG
   ========================================================= */

function findFreeTable(customer){

    let freeTables =
        tables.filter(table =>
            !table.occupied
        );

    if(freeTables.length === 0){
        return null;
    }

    /*
      Chọn bàn gần khách nhất.
    */

    freeTables.sort((a,b)=>{

        const da =
            distance(customer,a);

        const db =
            distance(customer,b);

        return da-db;

    });

    return freeTables[0];
}


/* =========================================================
   SPAWN KHÁCH
   ========================================================= */

function spawnCustomer(){

    if(!gameRunning){
        return;
    }

    if(customers.length >= MAX_CUSTOMERS){
        return;
    }

    /*
      Spawn từ hai phía đường.
    */

    const fromLeft =
        Math.random() < 0.5;

    const x =
        fromLeft ? -50 : 1250;

    const direction =
        fromLeft ? 1 : -1;

    const wantsFood =
        Math.random() < 0.72;

    const img =
        ASSETS.customerImages[
            randomInt(
                0,
                ASSETS.customerImages.length-1
            )
        ];

    const el =
        document.createElement("div");

    el.className =
        "customer";

    el.innerHTML = `
        <img src="${img}">
        <div class="customer-name">
            ${wantsFood ? "Khách" : "Qua đường"}
        </div>
    `;

    customersLayer.appendChild(el);

    const customer = {

        id:customerId++,

        x:x,

        y:randomInt(315,350),

        direction:direction,

        speed:random(0.8,1.4),

        wantsFood:wantsFood,

        state:wantsFood
            ? "LOOKING_FOR_TABLE"
            : "PASSING",

        table:null,

        waitUntil:0,

        element:el,

        enteredRestaurant:false

    };

    /*
      Chống spawn chồng nhau.
    */

    if(isCustomerPositionBlocked(customer)){

        el.remove();

        return;

    }

    customers.push(customer);

    updateCustomerVisual(customer);
}


/* =========================================================
   CHỐNG KHÁCH CHỒNG NHAU
   ========================================================= */

function isCustomerPositionBlocked(newCustomer){

    const MIN_DISTANCE = 48;

    for(const other of customers){

        if(distance(newCustomer,other)
            < MIN_DISTANCE){

            return true;
        }
    }

    return false;
}


/* =========================================================
   KIỂM TRA ĐƯỜNG ĐI
   ========================================================= */

function canEnterRestaurant(customer){

    /*
      Chỉ khách muốn ăn mới được vào quán.
    */

    if(!customer.wantsFood){
        return false;
    }

    /*
      Khu vực cửa quán ở bên trái.
    */

    const restaurantEntrance = {

        x:80,
        y:350

    };

    return distance(
        customer,
        restaurantEntrance
    ) < 100;
}


/* =========================================================
   KHÁCH KHÔNG VÀO QUÁN
   ========================================================= */

function updatePassingCustomer(customer){

    customer.x +=
        customer.direction *
        customer.speed;

    /*
      Luôn đi đến mép bản đồ.
      Không quay lại.
    */

    if(
        (customer.direction > 0 &&
         customer.x > 1250)
        ||
        (customer.direction < 0 &&
         customer.x < -80)
    ){

        removeCustomer(customer);

    }

}


/* =========================================================
   KHÁCH TÌM BÀN
   ========================================================= */

function updateLookingCustomer(customer){

    /*
      Nếu đã quá thời gian chờ,
      khách rời đi.
    */

    if(
        customer.waitUntil > 0 &&
        Date.now() > customer.waitUntil
    ){

        leaveRestaurant(customer);

        return;
    }


    /*
      Tìm bàn.
    */

    const table =
        findFreeTable(customer);

    if(table){

        table.occupied = true;

        table.customerId =
            customer.id;

        table.status.style.display =
            "block";

        customer.table =
            table;

        customer.state =
            "GOING_TO_TABLE";

        customer.enteredRestaurant =
            true;

        customer.waitUntil = 0;

        return;

    }


    /*
      Không còn bàn.
      Bắt đầu chờ.
    */

    if(customer.waitUntil === 0){

        customer.waitUntil =
            Date.now() +
            NO_TABLE_WAIT;

    }

    /*
      KHÔNG đứng kẹt ở bên phải.
      Đi chậm về phía cửa / mép trái.
    */

    customer.x -=
        customer.speed * 0.35;

}


/* =========================================================
   KHÁCH ĐI ĐẾN BÀN
   ========================================================= */

function updateGoingToTable(customer){

    if(!customer.table){

        customer.state =
            "LOOKING_FOR_TABLE";

        return;
    }

    const table =
        customer.table;

    const dx =
        table.x-customer.x;

    const dy =
        table.y-customer.y;

    const d =
        Math.sqrt(dx*dx+dy*dy);

    if(d < 4){

        customer.x =
            table.x;

        customer.y =
            table.y;

        customer.state =
            "EATING";

        return;

    }

    customer.x +=
        dx/d *
        customer.speed;

    customer.y +=
        dy/d *
        customer.speed;

}


/* =========================================================
   KHÁCH ĂN
   ========================================================= */

function updateEatingCustomer(customer){

    /*
      Khách ăn trong khoảng 5-10 giây.
    */

    if(!customer.eatingUntil){

        customer.eatingUntil =
            Date.now() +
            randomInt(5000,10000);

    }

    if(Date.now() >
       customer.eatingUntil){

        finishCustomer(customer);

    }

}


/* =========================================================
   KHÁCH RỜI ĐI
   ========================================================= */

function leaveRestaurant(customer){

    customer.state =
        "LEAVING";

    customer.direction =
        -1;

    customer.table = null;

    customer.waitUntil = 0;
}


/* =========================================================
   HOÀN THÀNH KHÁCH
   ========================================================= */

function finishCustomer(customer){

    /*
      Tính tiền.
    */

    const price =
        randomInt(80000,250000);

    money += price;

    reputation =
        Math.min(
            100,
            reputation+1
        );

    updateUI();

    showMessage(
        "Khách thanh toán +" +
        formatMoney(price)
    );

    if(customer.table){

        customer.table.occupied =
            false;

        customer.table.customerId =
            null;

        customer.table.status.style.display =
            "none";

        customer.table = null;

    }

    customer.state =
        "LEAVING";

    customer.direction =
        -1;

}


/* =========================================================
   CẬP NHẬT KHÁCH
   ========================================================= */

function updateCustomers(){

    /*
      Duyệt bản sao vì khách có thể bị xóa
      ngay trong vòng lặp.
    */

    for(
        const customer of [...customers]
    ){

        if(customer.state === "PASSING"){

            updatePassingCustomer(customer);

        }

        else if(
            customer.state ===
            "LOOKING_FOR_TABLE"
        ){

            updateLookingCustomer(customer);

        }

        else if(
            customer.state ===
            "GOING_TO_TABLE"
        ){

            updateGoingToTable(customer);

        }

        else if(
            customer.state ===
            "EATING"
        ){

            updateEatingCustomer(customer);

        }

        else if(
            customer.state ===
            "LEAVING"
        ){

            customer.x -=
                customer.speed * 1.4;

            /*
              Rời khỏi mép trái
              thì xóa hoàn toàn.
            */

            if(customer.x < -80){

                removeCustomer(customer);

            }

        }

        updateCustomerVisual(customer);

    }

}


/* =========================================================
   HIỂN THỊ KHÁCH
   ========================================================= */

function updateCustomerVisual(customer){

    customer.element.style.left =
        (customer.x-21) + "px";

    customer.element.style.top =
        (customer.y-21) + "px";

}


/* =========================================================
   XÓA KHÁCH
   ========================================================= */

function removeCustomer(customer){

    const index =
        customers.indexOf(customer);

    if(index !== -1){

        customers.splice(
            index,
            1
        );

    }

    if(customer.table){

        customer.table.occupied =
            false;

        customer.table.customerId =
            null;

        customer.table.status.style.display =
            "none";

    }

    if(customer.element){

        customer.element.remove();

    }

}


/* =========================================================
   SPAWN LIÊN TỤC
   ========================================================= */

function scheduleNextCustomer(){

    if(!gameRunning){
        return;
    }

    const delay =
        randomInt(
            SPAWN_MIN,
            SPAWN_MAX
        );

    setTimeout(()=>{

        spawnCustomer();

        scheduleNextCustomer();

    },delay);

}


/* =========================================================
   PLAYER
   ========================================================= */

function updatePlayer(){

    let dx = 0;
    let dy = 0;

    if(keys["ArrowUp"] ||
       keys["w"] ||
       keys["W"]){

        dy -= player.speed;

    }

    if(keys["ArrowDown"] ||
       keys["s"] ||
       keys["S"]){

        dy += player.speed;

    }

    if(keys["ArrowLeft"] ||
       keys["a"] ||
       keys["A"]){

        dx -= player.speed;

    }

    if(keys["ArrowRight"] ||
       keys["d"] ||
       keys["D"]){

        dx += player.speed;

    }

    player.x += dx;
    player.y += dy;


    /*
      Giới hạn nhân vật trong map.
    */

    player.x =
        Math.max(
            20,
            Math.min(
                1160,
                player.x
            )
        );

    player.y =
        Math.max(
            300,
            Math.min(
                600,
                player.y
            )
        );


    playerEl.style.left =
        player.x + "px";

    playerEl.style.top =
        player.y + "px";

}


/* =========================================================
   KEYBOARD
   ========================================================= */

document.addEventListener(
    "keydown",
    e=>{

        keys[e.key] = true;

    }
);

document.addEventListener(
    "keyup",
    e=>{

        keys[e.key] = false;

    }
);


/* =========================================================
   MOBILE CONTROL
   ========================================================= */

function holdButton(id,key){

    const btn =
        document.getElementById(id);

    const start = e=>{

        e.preventDefault();

        keys[key] = true;

    };

    const end = e=>{

        e.preventDefault();

        keys[key] = false;

    };

    btn.addEventListener(
        "touchstart",
        start,
        {passive:false}
    );

    btn.addEventListener(
        "touchend",
        end,
        {passive:false}
    );

    btn.addEventListener(
        "mousedown",
        start
    );

    btn.addEventListener(
        "mouseup",
        end
    );

    btn.addEventListener(
        "mouseleave",
        end
    );

}

holdButton("up","ArrowUp");
holdButton("down","ArrowDown");
holdButton("left","ArrowLeft");
holdButton("right","ArrowRight");


/* =========================================================
   PHỤC VỤ
   ========================================================= */

function checkNearbyTable(){

    for(const table of tables){

        if(!table.occupied){
            continue;
        }

        const d =
            distance(
                player,
                table
            );

        if(d < 90){

            return table;

        }

    }

    return null;
}

function serveFood(){

    const table =
        checkNearbyTable();

    if(!table){

        showMessage(
            "Không có khách gần đây."
        );

        return;
    }

    /*
      Phục vụ nhanh hơn cho khách.
    */

    const customer =
        customers.find(
            c =>
            c.id ===
            table.customerId
        );

    if(customer){

        customer.eatingUntil =
            Date.now() +
            3000;

        showMessage(
            "Đã phục vụ món ăn."
        );

    }

    closeServePanel();
}

function closeServePanel(){

    document.getElementById(
        "servePanel"
    ).style.display =
        "none";

}


/* =========================================================
   KIỂM TRA PHỤC VỤ GẦN NGƯỜI CHƠI
   ========================================================= */

function checkServe(){

    const table =
        checkNearbyTable();

    if(table){

        document.getElementById(
            "servePanel"
        ).style.display =
            "block";

    }

}


/* =========================================================
   NGÀY
   ========================================================= */

let dayTimer = 0;

function updateDay(){

    dayTimer++;

    /*
      60 giây = 1 ngày.
      Có thể đổi nếu muốn.
    */

    if(dayTimer >= 60){

        dayTimer = 0;

        currentDay++;

        if(currentDay > 30){

            currentDay = 30;

            gameRunning = false;

            showMessage(
                "Đã hết 30 ngày!"
            );

        }

        /*
          Cứ 6 ngày chủ nợ đến.
        */

        if(
            currentDay % 6 === 0
        ){

            showMessage(
                "Chủ nợ đến đòi tiền!"
            );

        }

        updateUI();

    }

}


/* =========================================================
   GAME LOOP
   ========================================================= */

function gameLoop(){

    if(gameRunning){

        updatePlayer();

        updateCustomers();

        checkServe();

        updateDay();

    }

    requestAnimationFrame(
        gameLoop
    );

}


/* =========================================================
   KHỞI ĐỘNG
   ========================================================= */

function init(){

    /*
      Đảm bảo ảnh player dùng đúng asset.
    */

    document.getElementById(
        "playerImg"
    ).src =
        ASSETS.player;

    createTables();

    updateUI();

    /*
      Tạo sẵn một số khách ban đầu.
    */

    for(let i=0;i<8;i++){

        setTimeout(
            spawnCustomer,
            i*350
        );

    }

    /*
      Sau đó spawn liên tục.
    */

    scheduleNextCustomer();

    gameLoop();

}

init();

</script>
